<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask To-Do Application</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #CCCCCC;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px dashed #EEEEEE;
        }

        .todo-item.complete .title {
            text-decoration: line-through;
            color: #7F8C8D;
        }

        .actions a {
            margin-left: 10px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .update-btn {
            background-color: #4CAF50;
            color: white;
        }

        .delete-btn {
            background-color: #F44336;
            color: white;
        }

        .add-form {
            display: flex;
            margin-bottom: 20px
        }

        .add-form input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #CCCCCC;
            border-radius: 4px;
        }

        .add-form button {
            padding: 8px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px
        }
    </style>
</head>
<body>
<h1>The To-Do List</h1>

<form class="add-form" action="{{ url_for('add') }}" method="POST">
    <input type="text" name="title" placeholder="Enter new task..." required>
    <button type="submit">Submit</button>
</form>

<hr>

<div>
    {% for todo in todo_list %}
    <div class="todo-item" {% if todo.complete %}completed{% endif %}>
        <span class="title">{{ todo.title }}</span>
        <div class="actions">
            <a href="{{ url_for('update', todo_id=todo.id) }}" class="update-btn">
                {% if todo.complete %}Undo{% else %}Complete{% endif %}
            </a>
            <a href="{{ url_for('delete', todo_id=todo.id) }}" class="delete-btn">
                Delete
            </a>
        </div>
    </div>
    {% endfor %}
</div>


</body>
</html>
